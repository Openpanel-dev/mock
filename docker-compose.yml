services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    # ports:
    #   - "3000:3000"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
